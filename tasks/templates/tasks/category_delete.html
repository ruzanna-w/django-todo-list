{% extends "base.html" %}

{% block title%}
    Delete Category
{% endblock%}

{% block content %}
    <div class="content-box">
        <form class="delete-form" method="post">
            {% csrf_token%}
            <fieldset class="delete-title"><h5 class="text">Do you really want to delete a category?</h5></fieldset>
            <input type="text" class="delete-tag-input" value="{{ task_category.title }}" readonly>
            <div class="confirm_removal">
                <a href="{% url 'tasks:task_category' %}" class="btn-outline">NO</a>
                <input type="submit" class="confirm-yes-btn" value="YES">
            </div>
        </form>
    </div>
{% endblock %}
