{%extends "base.html"%}

{% block title %}
    Task form
{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <fieldset>
            <legend>
                <h1 class="beaver-title">
                    {% if task %}
                        Edit Task
                    {% else %}
                        Add task
                    {% endif %}
                </h1>
            </legend>
            <div class="form-container">
                <label class="form-label">Title</label>
                <input type="text" name="title" value="{{ task.title|capfirst }}" placeholder="Enter task title" required>
            </div>
            
            <div class="form-container">
                <label class="form-label">Description</label>
                <input type="text" name="description" value="{{ task.description|capfirst }}" placeholder="Enter description"required>
            </div>

            <div class="form-container">
                <label class="form-label">Deadline</label>
                <input type="date" name="deadline" value="{{ task.deadline|date:'Y-m-d' }}" lang="en">
            </div>

            <div class="form-container">
                <label class="form-label">Priority</label>
                <select name="priority" required>
                    <option value="" disabled {% if not task %} selected {% endif %}>Select priority</option>
                    <option value="low" {% if task.priority == 'low' %} selected {% endif %}>Low</option>
                    <option value="medium"{% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high"{% if task.priority == 'high' %}selected{% endif %}>High</option>
                </select>
            </div>

            <div class="form-container">
                <label class="form-label">Category</label>
                <select name="category" required>
                    <option value="">Select category</option>

                    {% for tl in task_list %}
                        <option value="{{tl.id}}"
                            {% if task.task_list_id == tl.id %}selected{% endif %}>
                            {{tl.title}}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-container">
                <label class="form-label">Tags</label>
                <div class="tags-group">
                    {% for tag in tag_list %}
                        <label class="tag-checkbox">
                            <input type="checkbox" 
                                   name="tags" 
                                   value="{{ tag.id }}"
                                   {% if tag in task.tags.all %}checked{% endif %}>
                            {{tag.title}}
                        </label>
                    {% endfor %}
                </div>
            </div>

            <div class="button-group form-btn-group">
                <div class="button-group-left">
                    <a href="{% url 'tasks:home' %}" class="btn-outline">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path
                                d="M3 10.5L12 3L21 10.5V21H14V15H10V21H3V10.5Z"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <span>Home</span>
                    </a>
                    <a href="{% url 'tasks:tasks' %}" class="btn-outline">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path
                                d="M4 6H20M4 12H20M4 18H20"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>
                        <span>All Tasks</span>
                    </a>
                </div>
                {% if task %}
                    <input type="submit" value="EDIT">
                {% else %}
                    <input type="submit" value="Create New Task">
                {% endif %}
            </div>

        </fieldset>

    </form>
{% endblock %}
